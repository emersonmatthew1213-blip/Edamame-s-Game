<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hawkins Platformer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Hawkins Platformer</h1>
    <div class="controls">A / ← : left · D / → : right · W / ↑ / Space: jump · M: mute</div>
  </header>
  <main>
    <canvas id="gameCanvas" width="960" height="540"></canvas>
    <div id="hud">
      <div id="location">Hawkins, Indiana</div>
      <div id="message" class="hidden"></div>
    </div>
  </main>
  <footer>
    <small>Converted to platformer — modern visuals</small>
  </footer>
  <script src="script.js"></script>
</body>
</html>
